spring.application.name=Backend
server.port=8081

# JDBC URL used to connect to the MySQL database
# localhost = MySQL running on this machine
# 3306 = Default MySQL port
# seatlock_db = Database name
spring.datasource.url=jdbc:mysql://localhost:3306/seatlock_db 

# MySQL database username
spring.datasource.username=root

# MySQL database password
# Replace this with your actual MySQL password
spring.datasource.password=Sagar@5732!

# MySQL JDBC driver class used by Spring Boot to communicate with MySQL
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically updates database tables based on entity classes
# Useful during development; we'll use controlled migrations later
spring.jpa.hibernate.ddl-auto=update

# Displays SQL queries executed by Hibernate in the console
#spring.jpa.show-sql=true
spring.jap.show-sql=true

# Formats SQL queries to make them easier to read
spring.jpa.properties.hibernate.format_sql=true